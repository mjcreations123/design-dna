schema_version: 2
owner: "Design DNA publisher"
scope: "Portable publisher guidance unless an accountable owner supplies a project override"
status: "active"

defaults:
  time_register: "require-review"
  visible_ambition: "require-review"
  public_orientation: "require-review"
  sensory_media_strategy: "require-review"
  generated_concept_media: "ask"
  typography_comfort: "require-review"
  public_copy_boundary: "require"
  owner_rejection_revalidation: "require"
  content_hierarchy: "require-review"
  semantic_implementation: "require"
  motion_and_interaction: "require-review"
  release_residue: "prohibit"
  truth_and_claims: "prohibit"
  working_controls: "prohibit"
  cross_project_comparison: "opt-in"
  cultural_context: "require-review"
  assurance_boundaries: "require"
  rendered_review: "require"
  rendered_font_verification: "require-review"
  parseable_public_text: "require"
  delivery_state_honesty: "require"
  ledger_consultation: "opt-in"
  preship_gate: "require"

interpretation:
  - "A disposition applies to the undesirable finding represented by its concern ID. In particular, truth_and_claims: prohibit means prohibit unsupported, fabricated, or misleading claim findings; it does not prohibit truthful sourced claims."
  - "working_controls: prohibit means prohibit broken or misleading affordance findings; it requires visible controls to work or disclose their honest state."
  - "These publisher defaults are scoped quality concerns, not buyer approval, aesthetic doctrine, or reliable detectors of AI authorship."
  - "A project owner may add, omit, or rename concerns for the approved scope; no portable list of aesthetic ingredients or exceptions is required."
  - "Higher-priority safety, accessibility, factual, legal, brand, cultural, and explicit project requirements win."
  - "Determine the time register from the brief, subject, audience, owner preference, and evidence; a category never implies vintage or contemporary styling by itself."
  - "A substantial greenfield public surface should feel resolved and connected to its project, but no font, palette, style, geometry, ornament, layout, interaction, motion, media count, or concept count is globally required or forbidden."
  - "Common choices are not automatically generic and unusual choices are not automatically good. Judge the rendered combination, project fit, and execution."
  - "Avoiding generic patterns is not a low-energy default. Match the requested ambition without forcing a signature device, channel count, novelty quota, or energy formula."
  - "Public orientation must fit the experience. Task-led work should make the relevant offer or situation and a useful continuation understandable; art, narrative, editorial, and entertainment work may deliberately unfold."
  - "A deliberate media strategy can choose documentary, commissioned, supplied, generated, illustrative, abstract, typographic, mixed, or no media when that decision fits the project and its truth boundary."
  - "Generated concept media remains opt-in for the exact approved scope and requires provenance, artifact inspection, rights and representation review, proportionate disclosure, and a factual boundary."
  - "Typography comfort is judged from actual language, roles, widths, states, scripts, loading, and user settings rather than from family names or a universal spacing formula."
  - "Direct accountable-owner rejection reopens the affected work until the revised candidate is rendered and dispositioned."
  - "Motion, ornament, fragments, gradients, icons, and conventional components are neutral ingredients. Investigate rendered irrelevance, obstruction, inconsistency, repetition without project reason, and preference failures."
  - "Active policy defaults annotate scanner findings; they never suppress them or convert an aesthetic preference into a release gate."
  - "Literal unfinished filler, fabricated proof, broken behavior, and inaccessible output remain evidence-bound defects; any exception must be exact, owner-reviewed, fingerprint-bound, scoped, and expiring."
  - "assurance_boundaries: require activates policy/absolutes.md only for truth, rights, privacy, access, working behavior, evidence honesty, delivery authority, and explicit project contracts; it contains no portable aesthetic bans."
  - "rendered_review: require means substantial visual work is judged in a real render at project-relevant wide and narrow conditions plus the states and pressure cases that can expose its risks."
  - "rendered_font_verification: require-review means choose evidence appropriate to the type-delivery claim and risk. Static inventory, browser availability, computed styling, network delivery, metric comparison, fallback rehearsal, and visual inspection are distinct evidence; no project is failed merely for choosing a system stack."
  - "parseable_public_text: require means prominent, repeated, interactive, data-shaped, and doubtful text is reviewed in context and deterministic residue checks are triaged rather than converted into a punctuation or phrase blacklist."
  - "delivery_state_honesty: require means infer concept, demo, staging, or production only from the current task, repository, integration state, and accountable authority. Unknown externally acting behavior stays nonproduction; a placeholder register is created only when unresolved material or behavior exists."
  - "ledger_consultation: opt-in and cross_project_comparison: opt-in require accountable-owner authorization for minimized history at a host-neutral location such as ~/.design-dna/LEDGER.md; absence of that evidence is disclosed, not silently searched or treated as failure."
  - "preship_gate: require means templates/preship-gate.md is scoped to the work and a failed applicable assurance boundary blocks the corresponding completion claim."
