name: Design DNA CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python:
          - "3.10"
          - "3.12"
          - "3.14"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      DESIGN_DNA_PLAYWRIGHT_MODULE_DIR: ${{ github.workspace }}/maintainer/node_modules
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: maintainer/requirements-dev.lock
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: maintainer/package-lock.json
      - name: Install pinned maintainer dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r maintainer/requirements-dev.lock
      - name: Install pinned browser-review dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: maintainer
      - name: Install Chromium and Linux browser dependencies
        if: ${{ runner.os == 'Linux' }}
        run: npx playwright install --with-deps chromium
        working-directory: maintainer
      - name: Install Chromium
        if: ${{ runner.os != 'Linux' }}
        run: npx playwright install chromium
        working-directory: maintainer
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run and attest unit and adversarial tests with zero unwaived skips
        run: python -I -S -B maintainer/scripts/attest_tests.py --plugin-root . --output "${{ runner.temp }}/design-dna-test-attestation.json"
      - name: Validate evidence
        run: python -B maintainer/scripts/validate_evidence.py --plugin-root .
      - name: Check internal links
        run: python -B maintainer/scripts/check_links.py .
      - name: Run development audit
        shell: bash
        run: |
          set -o pipefail
          python -B maintainer/scripts/audit_package.py --plugin-root . |
            tee "$RUNNER_TEMP/design-dna-package-audit.json"
      - name: Retain matrix test and package-audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-attestation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/design-dna-test-attestation.json
            ${{ runner.temp }}/design-dna-package-audit.json
          if-no-files-found: error
          retention-days: 30

  rendered-browser:
    name: Rendered browser harness / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      DESIGN_DNA_PLAYWRIGHT_MODULE_DIR: ${{ github.workspace }}/maintainer/node_modules
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: maintainer/requirements-dev.lock
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: maintainer/package-lock.json
      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r maintainer/requirements-dev.lock
      - name: Install pinned browser-review dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: maintainer
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: maintainer
      - name: Locate Playwright Chromium
        shell: bash
        run: |
          browser_path="$(node -e "process.stdout.write(require('./maintainer/node_modules/playwright').chromium.executablePath())")"
          printf 'DESIGN_DNA_BROWSER_EXECUTABLE=%s\n' "$browser_path" >> "$GITHUB_ENV"
      - name: Check the rendered-review program
        run: npm run check:rendered-review
        working-directory: maintainer
      - name: Exercise the live rendered-browser harness
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest maintainer.tests.test_rendered_review_harness -v 2>&1 |
            tee "$RUNNER_TEMP/design-dna-rendered-tests.log"
      - name: Retain rendered-browser test log
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rendered-browser-ubuntu-node22-python312
          path: ${{ runner.temp }}/design-dna-rendered-tests.log
          if-no-files-found: error
          retention-days: 30
