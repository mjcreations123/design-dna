    discovery_route: "~/.agents/skills/design-dna"
    designed: true
    static_validation: "passed"
    isolated_behavioral_eval: "pending"
    rendered_eval: "pending"
    installed_sync: "passed"
    evidence:
      - "maintainer/attestations/test-attestation.json"
      - "maintainer/attestations/install-lifecycle.json"
      - "maintainer/attestations/codex-plugin-validation.json"
      - "maintainer/attestations/route-verification.json"
    notes:
      - "The direct .agents route is the single intended visible Codex skill."
      - "Package plugin metadata is a portable source artifact, not a second installed route."
      - "The Plugin Creator validation, installer-lifecycle, and route records bind the 11.0.0 development-candidate source tree; host activation remains unverified."
      - "Static validation is scoped to the publisher-reviewed Plugin Creator validator byte pin; that pin is not an OpenAI signature and must be replayed with the explicit validator path."
      - "Local forward builds and rendered QA runs are diagnostic evidence, not trusted host-native release evidence."
      - "The Codex desktop host-version probe is unavailable; no host-native model run is claimed."
  claude_code:
    discovery_route: "~/.claude/skills/design-dna"
    designed: true
    static_validation: "blocked_tool_unavailable"
    isolated_behavioral_eval: "blocked_tool_unavailable"
    rendered_eval: "blocked_tool_unavailable"
    installed_sync: "passed"
    evidence:
      - "maintainer/attestations/test-attestation.json"
      - "maintainer/attestations/install-lifecycle.json"
      - "maintainer/attestations/route-verification.json"
    notes:
      - "The direct .claude route is the single intended visible Claude Code skill."
      - "The installer-lifecycle and route records bind the 11.0.0 development-candidate source tree; host activation remains unverified."
      - "A new Claude Code session may be required after sync."
      - "The Claude executable is not available on PATH in the current verification environment."
      - "Repository JSON-schema validation passed, but it is not substituted for the unavailable official Claude Code plugin validator."

