portable_contract:
  skill_entrypoint: "skills/design-dna/SKILL.md"
  host_specific_runtime_references:
    - "skills/design-dna/references/platform-codex.md"
    - "skills/design-dna/references/platform-claude.md"
  unsupported_claims:
    - "Identical model output across hosts"
    - "Guaranteed invocation when the user does not request relevant web-design work"
    - "Guaranteed human-only appearance or undetectable AI involvement"

release_limitations:
  - "No trusted host-native adapter is registered for controlled Codex or Claude Code behavioral evidence."
  - "The Claude executable is not available on PATH in the current verification environment."
  - "No formal controlled host evaluations or independent rendered-review records are promoted for the 11.0.0 development candidate; local forward builds remain diagnostic evidence only."
  - "Connected Public Experience records, when selected, are project-level evidence only; they do not establish host activation, owner acceptance, target-user validation, production readiness, real service operation, or visual quality."
