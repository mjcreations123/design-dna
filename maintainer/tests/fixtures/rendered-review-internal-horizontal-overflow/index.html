<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Internal horizontal overflow fixture</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1 id="overflow-title">From Lenape Homeland to Boomtown</h1>

    <section aria-label="Intentional overflow controls">
      <div id="intentional-scroll" class="handled-overflow handled-overflow--scroll">
        <span id="intentional-scroll-track" class="handled-overflow__wide-track">
          <span id="intentional-scroll-content" class="handled-overflow__narrow-content">
            This intentionally scrollable line is wider than its viewport.
          </span>
        </span>
      </div>
      <div id="intentional-hidden" class="handled-overflow handled-overflow--hidden">
        This intentionally hidden line is wider than its viewport.
      </div>
      <div id="intentional-clip" class="handled-overflow handled-overflow--clip">
        This intentionally clipped line is wider than its viewport.
      </div>
    </section>
  </main>
</body>
</html>
